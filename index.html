<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 2-Month Anniversary 💙</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="main-container">
        
        <!-- MÀN HÌNH MENU -->
        <div id="screen-menu" class="screen active">
            <div class="pill-btn">Happy 2-month Anniversary</div>
            <h1 class="title">Thử thách của anh <span class="pulse">💙</span></h1>
            
            <div style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
                <!-- ẢI 1 (Trái tim và Dâu tây) -->
                <div>
                    <div class="level-icon pulse" id="level-1-icon" onclick="startGatekeeper()">
                        <div class="strawberry" id="secret-trigger">🍓</div>
                    </div>
                    <p style="color: #0277bd; font-weight: bold; font-size: 14px; margin-top: 5px;">Ải 1: Trả lời sai là dỗi!!!</p>
                </div>
                
                <!-- ẢI 2 (Máy gắp thú - Ban đầu bị khóa) -->
                <div>
                    <div class="level-icon" id="level-2-icon" style="filter: grayscale(100%); opacity: 0.5; cursor: not-allowed; margin-top: 30px;" onclick="startLevel2()">
                        <div class="strawberry">🎰</div>
                    </div>
                    <p style="color: #999; font-weight: bold; font-size: 14px; margin-top: 5px;" id="level-2-text">Ải 2: (Vượt Ải 1 mở)</p>
                </div>
            </div>
        </div>

        <!-- MÀN HÌNH NÚT CHẠY TRỐN -->
        <div id="screen-gatekeeper" class="screen">
            <div class="question-text">Anh yêu em không?</div>
            <button class="btn" id="btn-yes" onmouseover="evadeButton(this)" onclick="evadeButton(this)">Có</button>
            <button class="btn" id="btn-no" onclick="handleGatekeeperNo()">Không</button>
        </div>

        <!-- MÀN HÌNH TRẮC NGHIỆM CHÍNH (ẢI 1) -->
        <div id="screen-quiz" class="screen">
            <div class="lives" id="lives-display">❤️❤️❤️</div>
            <div class="question-text" id="quiz-question"></div>
            <div id="quiz-options"></div>
        </div>

        <!-- MÀN HÌNH MÁY GẮP THÚ (ẢI 2) -->
        <div id="screen-level2" class="screen">
            <div class="question-text">Máy Gắp Kỷ Niệm 🎰</div>
            <p style="margin-bottom: 15px; font-size: 14px; color: #0288d1;">Xem nhân phẩm anh nay gắp được gì nè!</p>
            
            <div class="claw-machine">
                <div class="claw" id="claw">🦾</div>
                <!-- Nhóm sticker tự chế -->
                <div class="stickers-pile">
                    <img src="1.png" class="sticker-img" alt="sticker" onerror="this.src='https://via.placeholder.com/50/e1f5fe/0288d1?text=1'">
                    <img src="2.png" class="sticker-img" alt="sticker" onerror="this.src='https://via.placeholder.com/50/e1f5fe/0288d1?text=2'">
                    <img src="3.png" class="sticker-img" alt="sticker" onerror="this.src='https://via.placeholder.com/50/e1f5fe/0288d1?text=3'">
                    <img src="4.png" class="sticker-img" alt="sticker" onerror="this.src='https://via.placeholder.com/50/e1f5fe/0288d1?text=4'">
                    <img src="1.png" class="sticker-img" alt="sticker" onerror="this.src='https://via.placeholder.com/50/e1f5fe/0288d1?text=1'">
                </div>
            </div>
            
            <button class="btn green" id="btn-gap" onclick="playClaw()">Gắp ngay!</button>
            <button class="btn" onclick="goMenu()">Quay lại Menu</button>
        </div>

    </div>

    <!-- POPUP PHẢN HỒI CHUNG -->
    <div class="modal" id="popup-modal">
        <div class="modal-content">
            <div class="modal-emoji" id="popup-emoji">😡</div>
            <div class="modal-text" id="popup-text"></div>
            <!-- Đổi chữ thành Tiếp theo -->
            <button class="btn" onclick="closePopup()">Tiếp theo ➡️</button>
        </div>
    </div>

    <!-- POPUP BẢNG LỜI KHAI CỦA ADMIN (BÍ MẬT) -->
    <div class="modal" id="history-modal">
        <div class="modal-content">
            <h2 style="color: #0288d1; margin-bottom: 15px; text-align: center;">⚖️ Biên bản lời khai</h2>
            <div id="history-content"></div>
            <button class="btn" onclick="closeHistory()">Đóng</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
